name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.app }} – lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]

    # The backend's integration tests need a real database (same settings as docker-compose.yml).
    # The frontend job does not use it; starting it there costs a few seconds.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wastable
          POSTGRES_PASSWORD: wastable
          POSTGRES_DB: wastable
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wastable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://wastable:wastable@localhost:5432/wastable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w ${{ matrix.app }}

      - name: Typecheck
        run: npm run typecheck -w ${{ matrix.app }}

      - name: Migrate test database
        if: matrix.app == 'backend'
        run: npm run db:migrate -w backend

      - name: Test
        run: npm run test -w ${{ matrix.app }} --if-present

      - name: Build
        run: npm run build -w ${{ matrix.app }}
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api

  format:
    name: Prettier format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
