name: Deploy to Heroku

# Manual only: Actions tab -> "Deploy to Heroku" -> Run workflow. See DEPLOYMENT.md for setup.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which app to deploy
        type: choice
        options: [both, api, web]
        default: both

concurrency:
  group: deploy-heroku
  cancel-in-progress: false

permissions:
  contents: read

env:
  HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
  # Calls the Heroku Platform API and prints Heroku's error message when a call fails.
  # Usage: heroku_api METHOD PATH JSON_BODY [ACCEPT_VARIANT]
  HEROKU_API_FN: |
    heroku_api() {
      local out status
      out=$(mktemp)
      status=$(curl -sS -o "$out" -w '%{http_code}' -X "$1" "https://api.heroku.com$2" \
        -H "Authorization: Bearer $HEROKU_API_KEY" \
        -H "Accept: application/vnd.heroku+json; version=3${4:+.$4}" \
        -H "Content-Type: application/json" \
        -d "$3")
      if [ "$status" -ge 300 ]; then
        echo "::error::Heroku API $1 $2 returned HTTP $status: $(cat "$out")"
        return 1
      fi
      echo "Heroku API $1 $2 -> HTTP $status"
    }

jobs:
  api:
    name: API -> ${{ vars.HEROKU_API_APP }}
    if: inputs.target != 'web'
    # Secrets and variables come from Settings -> Environments -> heroku
    environment: heroku
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP: ${{ vars.HEROKU_API_APP }}
    steps:
      - name: Check settings
        run: |
          ok=true
          [ -n "$HEROKU_API_KEY" ] || { echo "::error::Secret HEROKU_API_KEY is missing from the 'heroku' environment"; ok=false; }
          [ -n "$APP" ] || { echo "::error::Variable HEROKU_API_APP is missing (it must be an environment *variable*, not a secret)"; ok=false; }
          case "$APP" in *[!a-z0-9-]*) echo "::error::HEROKU_API_APP must be the app *name* from the Heroku dashboard (e.g. wastable-api), not a URL. Got: $APP"; ok=false ;; esac
          $ok

      - uses: actions/checkout@v7

      # Same as `heroku stack:set container`, which the Heroku dashboard cannot do
      - name: Use the container stack
        run: |
          eval "$HEROKU_API_FN"
          heroku_api PATCH "/apps/$APP" '{"build_stack":"container"}'

      - name: Log in to the Heroku container registry
        run: echo "$HEROKU_API_KEY" | docker login registry.heroku.com --username=_ --password-stdin

      - name: Build and push the image
        run: |
          IMAGE=registry.heroku.com/$APP/web
          # Heroku only accepts classic Docker v2 manifests (no OCI index / attestations)
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --output type=image,name="$IMAGE",push=true,oci-mediatypes=false \
            -f backend/Dockerfile .
          # Heroku releases by the image *config* digest, read back from its registry
          # (docker inspect's .Id is a different digest with the containerd image store)
          MANIFEST=$(docker buildx imagetools inspect --raw "$IMAGE")
          if echo "$MANIFEST" | jq -e '.manifests' > /dev/null; then
            DIGEST=$(echo "$MANIFEST" | jq -r '[.manifests[] | select(.platform.architecture == "amd64")][0].digest')
            MANIFEST=$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")
          fi
          IMAGE_ID=$(echo "$MANIFEST" | jq -r '.config.digest')
          case "$IMAGE_ID" in sha256:*) ;; *) echo "::error::Could not read the image digest. Manifest: $MANIFEST"; exit 1 ;; esac
          echo "Image config digest: $IMAGE_ID"
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Release (migrations run when the new dyno starts)
        run: |
          eval "$HEROKU_API_FN"
          heroku_api PATCH "/apps/$APP/formation" \
            "{\"updates\":[{\"type\":\"web\",\"docker_image\":\"$IMAGE_ID\"}]}" docker-releases

  web:
    name: Web -> ${{ vars.HEROKU_WEB_APP }}
    needs: api
    # Still deploy the web app when only it was selected (api job skipped)
    if: ${{ always() && inputs.target != 'api' && needs.api.result != 'failure' }}
    # Secrets and variables come from Settings -> Environments -> heroku
    environment: heroku
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP: ${{ vars.HEROKU_WEB_APP }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
    steps:
      - name: Check settings
        run: |
          ok=true
          [ -n "$HEROKU_API_KEY" ] || { echo "::error::Secret HEROKU_API_KEY is missing from the 'heroku' environment"; ok=false; }
          [ -n "$APP" ] || { echo "::error::Variable HEROKU_WEB_APP is missing (it must be an environment *variable*, not a secret)"; ok=false; }
          case "$APP" in *[!a-z0-9-]*) echo "::error::HEROKU_WEB_APP must be the app *name* from the Heroku dashboard (e.g. wastable-api), not a URL. Got: $APP"; ok=false ;; esac
          [ -n "$NEXT_PUBLIC_API_URL" ] || { echo "::error::Variable NEXT_PUBLIC_API_URL is missing (it must be an environment *variable*, not a secret)"; ok=false; }
          case "$NEXT_PUBLIC_API_URL" in https://*/api) ;; *) echo "::error::NEXT_PUBLIC_API_URL must look like https://<api-app>.herokuapp.com/api (no trailing slash). Got: $NEXT_PUBLIC_API_URL"; ok=false ;; esac
          $ok

      - uses: actions/checkout@v7

      # Same as `heroku stack:set container`, which the Heroku dashboard cannot do
      - name: Use the container stack
        run: |
          eval "$HEROKU_API_FN"
          heroku_api PATCH "/apps/$APP" '{"build_stack":"container"}'

      - name: Log in to the Heroku container registry
        run: echo "$HEROKU_API_KEY" | docker login registry.heroku.com --username=_ --password-stdin

      - name: Build and push the image
        run: |
          IMAGE=registry.heroku.com/$APP/web
          # Heroku only accepts classic Docker v2 manifests (no OCI index / attestations)
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --output type=image,name="$IMAGE",push=true,oci-mediatypes=false \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            -f frontend/Dockerfile .
          # Heroku releases by the image *config* digest, read back from its registry
          # (docker inspect's .Id is a different digest with the containerd image store)
          MANIFEST=$(docker buildx imagetools inspect --raw "$IMAGE")
          if echo "$MANIFEST" | jq -e '.manifests' > /dev/null; then
            DIGEST=$(echo "$MANIFEST" | jq -r '[.manifests[] | select(.platform.architecture == "amd64")][0].digest')
            MANIFEST=$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")
          fi
          IMAGE_ID=$(echo "$MANIFEST" | jq -r '.config.digest')
          case "$IMAGE_ID" in sha256:*) ;; *) echo "::error::Could not read the image digest. Manifest: $MANIFEST"; exit 1 ;; esac
          echo "Image config digest: $IMAGE_ID"
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Release
        run: |
          eval "$HEROKU_API_FN"
          heroku_api PATCH "/apps/$APP/formation" \
            "{\"updates\":[{\"type\":\"web\",\"docker_image\":\"$IMAGE_ID\"}]}" docker-releases
