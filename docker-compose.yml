# Local development services: PostgreSQL + Redis
# Start: npm run db:up    Stop: npm run db:down
services:
  postgres:
    image: postgres:17-alpine
    container_name: wastable-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wastable
      POSTGRES_PASSWORD: wastable
      POSTGRES_DB: wastable
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wastable -d wastable']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wastable-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
